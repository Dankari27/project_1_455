<text x="1338" y="497" font-size="15" fill="#1f2937">lookup = MAEK HEAD,</text>
<text x="1338" y="516" font-size="15" fill="#1f2937">MAEK PARAGRAF, MAEK LIST,</text>
<text x="1338" y="535" font-size="15" fill="#1f2937">GIMMEH TITLE, GIMMEH BOLD,</text>
