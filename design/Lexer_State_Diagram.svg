<text x="713" y="770" font-size="15" fill="#b91c1c">any other char</text>
<line x1="1450" y1="398" x2="1450" y2="398"/>
<circle cx="170" cy="470" r="46" fill="#e0ecff" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="170" y="466" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">q0</text>
<text x="170" y="486" text-anchor="middle" font-size="13" fill="#111827">START</text>
<circle cx="430" cy="300" r="46" fill="#e0ecff" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="430" y="296" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">q1</text>
<text x="430" y="316" text-anchor="middle" font-size="13" fill="#111827">HASH</text>
<circle cx="720" cy="300" r="46" fill="#e0ecff" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="720" y="296" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">q2</text>
<text x="720" y="316" text-anchor="middle" font-size="13" fill="#111827">KEYWORD</text>
<circle cx="1300" cy="140" r="46" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<circle cx="1300" cy="140" r="52" fill="none" stroke="#15803d" stroke-width="2.5"/>
<text x="1300" y="136" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">q3</text>
<text x="1300" y="156" text-anchor="middle" font-size="12" fill="#111827">ANNOTATION</text>
<circle cx="1060" cy="400" r="46" fill="#e0ecff" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="1060" y="396" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">q4</text>
<text x="1060" y="416" text-anchor="middle" font-size="13" fill="#111827">GAP</text>
<circle cx="1320" cy="400" r="46" fill="#e0ecff" stroke="#1d4ed8" stroke-width="2.5"/>
<text x="1320" y="396" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">q5</text>
<text x="1320" y="416" text-anchor="middle" font-size="12" fill="#111827">KEYWORD 2</text>
<circle cx="1580" cy="400" r="46" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<circle cx="1580" cy="400" r="52" fill="none" stroke="#15803d" stroke-width="2.5"/>
<text x="1580" y="396" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">q6</text>
<text x="1580" y="416" text-anchor="middle" font-size="12" fill="#111827">ANNOTATION</text>
<circle cx="430" cy="700" r="46" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
<circle cx="430" cy="700" r="52" fill="none" stroke="#15803d" stroke-width="2.5"/>
<text x="430" y="696" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">q7</text>
<text x="430" y="716" text-anchor="middle" font-size="13" fill="#111827">TEXT</text>
<circle cx="1060" cy="820" r="46" fill="#fde2e2" stroke="#b91c1c" stroke-width="2.5"/>
<text x="1060" y="816" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">qE</text>
<text x="1060" y="836" text-anchor="middle" font-size="13" fill="#111827">ERROR</text>
<rect x="1163" y="38" width="274" height="27" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="1170" y="57" font-size="15" fill="#15803d">emit annotation token, e.g. HAI</text>
<rect x="1426" y="286" width="308" height="27" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="1433" y="305" font-size="15" fill="#15803d">emit two-word token, e.g. MAEK_HEAD</text>
<rect x="193" y="807" width="115" height="46" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text x="200" y="826" font-size="15" fill="#15803d">ws, #, EOF *</text>
<text x="200" y="845" font-size="15" fill="#15803d">emit WORD</text>
<text x="30" y="1060" font-size="16" fill="#1f2937">Character classes:   letter = A-Z, a-z   |   text char = letter, 0-9, and  ,  .  &quot;  &#x27;  :  ?  !  %  =  /   |   ws = space, tab, CR, LF (newline)</text>
<text x="30" y="1084" font-size="16" fill="#1f2937">Double circle = accepting state: the gathered lexeme is returned as a token and the lexer goes back to q0 for the next token.</text>
<text x="30" y="1108" font-size="16" fill="#1f2937">*  = lookahead: the delimiter character is not part of the token; it is pushed back and read again from q0.</text>
<text x="30" y="1132" font-size="16" fill="#1f2937">lookup(): the gathered letters are converted to upper case and compared with the keyword tables, so #hai, #HAI and #Hai all match.</text>
</svg>